name: Check

# 계산 엔진 테스트와 스크립트 문법 검사. 숫자가 바뀌는 수정이면 tests/의 기준값을 같이 고칠 것
on:
  push:
    paths: ["site/**", "tests/**", "scripts/**", "worker/**", "wrangler.toml", ".github/workflows/check.yml"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine tests
        run: node --test tests/*.test.mjs
      - name: JS syntax
        run: for f in site/maps.js site/engine.js site/app.js worker/*.js; do node --check "$f"; done
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py
