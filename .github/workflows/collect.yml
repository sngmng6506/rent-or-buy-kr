name: Collect prices

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 키 확인, full = 전체 수집(시세+금리), rates = 금리만, reb-test = 부동산원 지수 확인"
        type: choice
        options: [test, full, rates, reb-test]
        default: test
      probe_names:
        description: "test 때 법정동코드로 조회해볼 이름, 쉼표 구분 (예: 충청북도 영동군)"
        required: false
        default: ""
      probe_codes:
        description: "test 때 매매 건수를 확인할 시군구 코드, 쉼표 구분"
        required: false
        default: ""
      only:
        description: "시도 코드 앞 2자리, 공백 구분 (예: 11 41 28). 비우면 전국"
        required: false
        default: ""
  schedule:
    - cron: "17 21 15 * *"   # 매달 16일 06:17 KST (실거래 신고 기한 30일 반영)

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test key
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          PROBE_NAMES: ${{ inputs.probe_names }}
          PROBE_CODES: ${{ inputs.probe_codes }}
        run: python scripts/collect.py --test
      - name: Test REB
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'reb-test')
        continue-on-error: true
        env:
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: python scripts/reb_index.py --test
      - name: Test ECOS
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/rates.py --test
      - name: Collect
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python scripts/collect.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Rates
        if: github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'rates'
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/rates.py
      - name: Commit data
        if: github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'rates'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/regions.json data/lawd_codes.json
          if [ -f site/data/rates.json ]; then git add site/data/rates.json; fi
          git diff --cached --quiet || git commit -m "data: 실거래가·금리 갱신 $(date +%Y-%m-%d)"
          # 수집하는 동안 main에 다른 커밋이 올라왔을 수 있어서 먼저 위에 얹음
          git pull --rebase origin main
          # 지역별 페이지(site/r)는 최신 index.html과 새 시세로 다시 만듦
          python scripts/build_pages.py
          git add -A site/r
          git diff --cached --quiet || git commit -m "pages: 지역별 페이지 갱신 $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
