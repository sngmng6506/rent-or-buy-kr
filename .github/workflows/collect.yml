name: Collect prices

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 노원구 한 달로 키 확인, full = 전체 수집"
        type: choice
        options: [test, full]
        default: test
      only:
        description: "시도 코드 앞 2자리, 공백 구분 (예: 11 41 28). 비우면 전국"
        required: false
        default: ""
  schedule:
    - cron: "17 21 15 * *"   # 매달 16일 06:17 KST (실거래 신고 기한 30일 반영)

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test key
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python scripts/collect.py --test
      - name: Collect
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python scripts/collect.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Commit data
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/regions.json
          git diff --cached --quiet || git commit -m "data: 실거래가 갱신 $(date +%Y-%m-%d)"
          git push
