# Cloudflare Workers 설정: site/는 정적 파일(assets), /api/*만 worker/index.js가 처리. 배포·D1은 docs/comments.md
name = "buy-or-rent-kr"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"

# 코멘트 켤 때 아래 주석을 풀고 D1 ID를 넣기 (가짜 ID가 있으면 배포가 실패함)
# [[d1_databases]]
# binding = "DB"
# database_name = "buy-or-rent-kr"
# database_id = "00000000-0000-0000-0000-000000000000"   # 배포 때 만든 D1의 ID로 바꾸기
# migrations_dir = "migrations"
