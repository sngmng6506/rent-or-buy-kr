# Cloudflare Workers 설정: site/는 정적 파일(assets), /api/*만 worker/index.js가 처리. 배포·D1은 docs/comments.md
name = "buy-or-rent-kr"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"

# 코멘트 저장소 (D1)
[[d1_databases]]
binding = "DB"
database_name = "buy-or-rent-kr"
database_id = "0d6d32fd-8b22-4cbf-bfd1-0ee627b90515"
migrations_dir = "migrations"
